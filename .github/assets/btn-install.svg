<svg xmlns="http://www.w3.org/2000/svg" width="98" height="34" viewBox="0 0 98 34" role="img" aria-label="Install">
  <defs>
    <linearGradient id="btn-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#122438"/>
      <stop offset="100%" stop-color="#091522"/>
    </linearGradient>
    <linearGradient id="btn-border" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3d6c99" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#1b364f" stop-opacity="0.4"/>
    </linearGradient>
  </defs>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    @keyframes zap { 0%, 100% { opacity: 0.85; transform: scale(1); } 50% { opacity: 1; transform: scale(1.15); } }
    .btn-icon { animation: zap 2.5s ease-in-out infinite; transform-origin: 18px 17px; }
    @media (prefers-reduced-motion: reduce) { .btn-icon { animation: none; } }
  </style>

  <rect x="0.8" y="0.8" width="96.4" height="32.4" rx="16.2" fill="url(#btn-bg)" stroke="url(#btn-border)" stroke-width="1.2"/>
  
  <!-- Bolt Icon -->
  <g class="btn-icon" transform="translate(13, 9)">
    <path d="M 6 0 L 1 8 L 5 8 L 4 15 L 10 6 L 6 6 Z" fill="#63e0c7"/>
  </g>
  
  <text x="32" y="21.5" fill="#edf3ff" font-size="12.5" font-weight="700" letter-spacing="0.2">Install</text>
</svg>
