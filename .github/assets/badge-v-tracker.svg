<svg xmlns="http://www.w3.org/2000/svg" width="138" height="28" viewBox="0 0 138 28" overflow="hidden" role="img" aria-label="Version 8.2.1">
  <defs>
    <linearGradient id="v-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#11253a"/>
      <stop offset="100%" stop-color="#0a1725"/>
    </linearGradient>
    <linearGradient id="v-border" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#38648c" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#1e3a54" stop-opacity="0.5"/>
    </linearGradient>
    <filter id="v-glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    @keyframes pulseEmerald {
      0%, 100% { r: 3px; opacity: 0.8; }
      50% { r: 4.5px; opacity: 1; }
    }
    .dot-v { animation: pulseEmerald 2.5s ease-in-out infinite; }
    @media (prefers-reduced-motion: reduce) { .dot-v { animation: none; } }
  </style>

  <!-- Badge Pill -->
  <rect x="0.8" y="0.8" width="136.4" height="26.4" rx="13.2" fill="url(#v-bg)" stroke="url(#v-border)" stroke-width="1.2"/>

  <!-- Glowing Beacon -->
  <circle cx="15" cy="14" r="5" fill="#63e0c7" opacity="0.25" filter="url(#v-glow)"/>
  <circle cx="15" cy="14" r="3.2" fill="#63e0c7" class="dot-v"/>

  <!-- Label & Value -->
  <text x="27" y="17.8" fill="#88a9c7" font-size="10.5" font-weight="700" letter-spacing="0.8">VERSION</text>
  <line x1="78" y1="8" x2="78" y2="20" stroke="#25425f" stroke-width="1.2"/>
  <text x="88" y="18" fill="#63e0c7" font-size="11.5" font-weight="700" letter-spacing="0.4">8.2.1</text>
</svg>
