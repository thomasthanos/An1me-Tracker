<svg xmlns="http://www.w3.org/2000/svg" width="124" height="34" viewBox="0 0 124 34" role="img" aria-label="Changelog">
  <defs>
    <linearGradient id="btn-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#122438"/>
      <stop offset="100%" stop-color="#091522"/>
    </linearGradient>
    <linearGradient id="btn-border" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3d6c99" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#1b364f" stop-opacity="0.4"/>
    </linearGradient>
  </defs>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    @keyframes pulseScroll { 0%, 100% { opacity: 0.8; } 50% { opacity: 1; } }
    .btn-icon { animation: pulseScroll 2.5s ease-in-out infinite; }
    @media (prefers-reduced-motion: reduce) { .btn-icon { animation: none; } }
  </style>

  <rect x="0.8" y="0.8" width="122.4" height="32.4" rx="16.2" fill="url(#btn-bg)" stroke="url(#btn-border)" stroke-width="1.2"/>
  
  <!-- Scroll / Changelog Icon -->
  <g class="btn-icon" transform="translate(13, 9)" fill="none" stroke="#c084fc" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
    <path d="M 2 2 L 11 2 A 2 2 0 0 1 13 4 L 13 14 A 2 2 0 0 1 11 16 L 2 16 A 2 2 0 0 1 0 14 L 0 4 A 2 2 0 0 1 2 2 Z"/>
    <line x1="3" y1="6" x2="10" y2="6"/>
    <line x1="3" y1="10" x2="8" y2="10"/>
  </g>
  
  <text x="34" y="21.5" fill="#edf3ff" font-size="12.5" font-weight="700" letter-spacing="0.2">Changelog</text>
</svg>
