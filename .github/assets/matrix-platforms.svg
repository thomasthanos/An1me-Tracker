<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="400" viewBox="0 0 1100 400" overflow="hidden" role="img" aria-labelledby="mx-title mx-desc">
  <title id="mx-title">Platform Feature Matrix</title>
  <desc id="mx-desc">Feature comparison between Desktop (Chrome/Edge) and Mobile (Safari on iPhone).</desc>
  <defs>
    <linearGradient id="mx-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a1524"/>
      <stop offset="100%" stop-color="#07101b"/>
    </linearGradient>

    <linearGradient id="mx-check" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#63e0c7"/>
      <stop offset="100%" stop-color="#57d6ff"/>
    </linearGradient>

    <clipPath id="mx-clip">
      <rect x="1" y="1" width="1098" height="398" rx="20"/>
    </clipPath>
  </defs>

  <style>
    text {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
  </style>

  <!-- Container with safe clipping -->
  <g clip-path="url(#mx-clip)">
    <rect x="1" y="1" width="1098" height="398" rx="20" fill="url(#mx-bg)"/>

    <!-- ================= COLUMN HEADERS ================= -->
    <!-- Capabilities label -->
    <text x="60" y="47" fill="#6d8da8" font-size="12.5" font-weight="800" letter-spacing="1.5">CAPABILITIES</text>

    <!-- Desktop Header -->
    <g transform="translate(520, 24)">
      <rect x="0" y="0" width="180" height="38" rx="19" fill="#0f2438" stroke="#254d70" stroke-width="1.2"/>
      <!-- Desktop Monitor Icon -->
      <g fill="none" stroke="#57d6ff" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" transform="translate(42, 11)">
        <rect x="0" y="0" width="18" height="12" rx="2"/>
        <line x1="9" y1="12" x2="9" y2="16"/>
        <line x1="4" y1="16" x2="14" y2="16"/>
      </g>
      <text x="70" y="24" fill="#ffffff" font-size="14" font-weight="700" letter-spacing="0.5">DESKTOP</text>
    </g>

    <!-- iPhone Header -->
    <g transform="translate(800, 24)">
      <rect x="0" y="0" width="180" height="38" rx="19" fill="#0f2438" stroke="#254d70" stroke-width="1.2"/>
      <!-- Phone Icon with isolated float animation -->
      <g transform="translate(52, 9.5)">
        <g>
          <animateTransform attributeName="transform" type="translate" values="0 0; 0 -2.5; 0 0" dur="3s" repeatCount="indefinite"/>
          <g fill="none" stroke="#63e0c7" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
            <rect x="0" y="0" width="12" height="19" rx="2.5"/>
            <line x1="4.5" y1="15" x2="7.5" y2="15"/>
          </g>
        </g>
      </g>
      <text x="74" y="24" fill="#ffffff" font-size="14" font-weight="700" letter-spacing="0.5">IPHONE</text>
    </g>

    <!-- Header Divider -->
    <line x1="50" y1="78" x2="1050" y2="78" stroke="#1d374e" stroke-width="1.5"/>

    <!-- ================= ROWS ================= -->

    <!-- ROW 1: Progress Tracking & Resume -->
    <g transform="translate(0, 85)">
      <text x="60" y="24" fill="#ffffff" font-size="15.5" font-weight="650">Episode Tracking &amp; Instant Resume</text>
      <text x="60" y="42" fill="#7593af" font-size="12.5">Auto-saves playback timestamps, completion detection</text>
      
      <!-- Desktop Check -->
      <g transform="translate(600, 24)" fill="none" stroke="url(#mx-check)" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="10" cy="5" r="14" fill="#0f2838" stroke="none"/>
        <polyline points="4,5 8,9 16,1"/>
      </g>

      <!-- iPhone Check -->
      <g transform="translate(880, 24)" fill="none" stroke="url(#mx-check)" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="10" cy="5" r="14" fill="#0f2838" stroke="none"/>
        <polyline points="4,5 8,9 16,1"/>
      </g>
    </g>
    <line x1="50" y1="138" x2="1050" y2="138" stroke="#162c40" stroke-width="1"/>

    <!-- ROW 2: Cross-Device Cloud Sync -->
    <g transform="translate(0, 145)">
      <text x="60" y="24" fill="#ffffff" font-size="15.5" font-weight="650">Cross-Device Cloud Sync</text>
      <text x="60" y="42" fill="#7593af" font-size="12.5">Seamless sync between PC &amp; iPhone via Firebase</text>

      <!-- Desktop Check -->
      <g transform="translate(600, 24)" fill="none" stroke="url(#mx-check)" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="10" cy="5" r="14" fill="#0f2838" stroke="none"/>
        <polyline points="4,5 8,9 16,1"/>
      </g>

      <!-- iPhone Check -->
      <g transform="translate(880, 24)" fill="none" stroke="url(#mx-check)" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="10" cy="5" r="14" fill="#0f2838" stroke="none"/>
        <polyline points="4,5 8,9 16,1"/>
      </g>
    </g>
    <line x1="50" y1="198" x2="1050" y2="198" stroke="#162c40" stroke-width="1"/>

    <!-- ROW 3: Full Library & Stats -->
    <g transform="translate(0, 205)">
      <text x="60" y="24" fill="#ffffff" font-size="15.5" font-weight="650">Library, Search, Backups &amp; Stats</text>
      <text x="60" y="42" fill="#7593af" font-size="12.5">Custom categories, filler tags, watch goals, JSON backup</text>

      <!-- Desktop Check -->
      <g transform="translate(600, 24)" fill="none" stroke="url(#mx-check)" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="10" cy="5" r="14" fill="#0f2838" stroke="none"/>
        <polyline points="4,5 8,9 16,1"/>
      </g>

      <!-- iPhone Check -->
      <g transform="translate(880, 24)" fill="none" stroke="url(#mx-check)" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="10" cy="5" r="14" fill="#0f2838" stroke="none"/>
        <polyline points="4,5 8,9 16,1"/>
      </g>
    </g>
    <line x1="50" y1="258" x2="1050" y2="258" stroke="#162c40" stroke-width="1"/>

    <!-- ROW 4: Speed Control & Outro Skip -->
    <g transform="translate(0, 265)">
      <text x="60" y="24" fill="#ffffff" font-size="15.5" font-weight="650">Speed Boost &amp; Outro Skip Button</text>
      <text x="60" y="42" fill="#7593af" font-size="12.5">Hotkey boost (F7), AniSkip powered outro skip</text>

      <!-- Desktop Check -->
      <g transform="translate(600, 24)" fill="none" stroke="url(#mx-check)" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="10" cy="5" r="14" fill="#0f2838" stroke="none"/>
        <polyline points="4,5 8,9 16,1"/>
      </g>

      <!-- iPhone Conditional -->
      <g transform="translate(880, 24)">
        <circle cx="10" cy="5" r="14" fill="#2d2212" stroke="none"/>
        <text x="10" y="9.5" text-anchor="middle" fill="#ffb84d" font-size="12" font-weight="800">2×</text>
      </g>
    </g>
    <line x1="50" y1="318" x2="1050" y2="318" stroke="#162c40" stroke-width="1"/>

    <!-- ROW 5: AniList & Desktop Alerts -->
    <g transform="translate(0, 325)">
      <text x="60" y="24" fill="#ffffff" font-size="15.5" font-weight="650">AniList Sync, Episode Alerts &amp; Side Panel</text>
      <text x="60" y="42" fill="#7593af" font-size="12.5">Kept off mobile to save iPhone battery and memory</text>

      <!-- Desktop Check -->
      <g transform="translate(600, 24)" fill="none" stroke="url(#mx-check)" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="10" cy="5" r="14" fill="#0f2838" stroke="none"/>
        <polyline points="4,5 8,9 16,1"/>
      </g>

      <!-- iPhone Absent Minus -->
      <g transform="translate(880, 24)" fill="none" stroke="#37536e" stroke-width="2.5" stroke-linecap="round">
        <circle cx="10" cy="5" r="14" fill="#0b1724" stroke="none"/>
        <line x1="4" y1="5" x2="16" y2="5"/>
      </g>
    </g>
  </g>

  <!-- Outer Border -->
  <rect x="1" y="1" width="1098" height="398" rx="20" fill="none" stroke="#223e59" stroke-width="1.8"/>
</svg>
