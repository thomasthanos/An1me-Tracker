<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="378" viewBox="0 0 1100 378" role="img" aria-labelledby="features-title features-description">
  <title id="features-title">An1me Tracker features</title>
  <desc id="features-description">Resume at the second you left. Keep series and episodes organized in your library. Use playback speed shortcuts on PC and hold for 2× on iPhone. Sign in for optional progress sync across devices.</desc>
  <style>
    text { font-family: "Segoe UI", -apple-system, BlinkMacSystemFont, Arial, sans-serif; }
    .feature-title { fill: #edf3ff; font-size: 38px; font-weight: 600; letter-spacing: -0.8px; }
    .feature-copy { fill: #a8bed4; font-size: 28px; }
    .feature-icon { fill: none; stroke: #57d6ff; stroke-width: 2.3; stroke-linecap: round; stroke-linejoin: round; }
  </style>
  <rect x="1" y="1" width="1098" height="376" rx="18" fill="#091827" stroke="#20394f" stroke-width="2"/>
  <path d="M550 34V344M41 189H1059" stroke="#233a50"/>

