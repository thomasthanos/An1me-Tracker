<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="480" viewBox="0 0 1100 480" role="img" aria-labelledby="hero-title hero-desc">
  <title id="hero-title">An1me Tracker — Never lose your episode</title>
  <desc id="hero-desc">Modern anime library and playback progress tracker for Chrome, Edge, and Safari on iPhone.</desc>
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bg-grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a1524"/>
      <stop offset="50%" stop-color="#060c16"/>
      <stop offset="100%" stop-color="#091422"/>
    </linearGradient>

    <radialGradient id="glow-cyan" cx="15%" cy="20%" r="55%">
      <stop offset="0%" stop-color="#57d6ff" stop-opacity="0.18"/>
      <stop offset="60%" stop-color="#57d6ff" stop-opacity="0.03"/>
      <stop offset="100%" stop-color="#57d6ff" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="glow-blue" cx="85%" cy="75%" r="60%">
      <stop offset="0%" stop-color="#4b8cff" stop-opacity="0.22"/>
      <stop offset="50%" stop-color="#63e0c7" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#4b8cff" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="brand-ink" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#63e0c7"/>
      <stop offset="50%" stop-color="#57d6ff"/>
      <stop offset="100%" stop-color="#4b8cff"/>
    </linearGradient>

    <linearGradient id="title-grad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="60%" stop-color="#eaf3ff"/>
      <stop offset="100%" stop-color="#b4dcff"/>
    </linearGradient>

    <linearGradient id="border-shimmer" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#57d6ff" stop-opacity="0.4"/>
      <stop offset="50%" stop-color="#243f5a" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#4b8cff" stop-opacity="0.4"/>
    </linearGradient>

    <linearGradient id="card-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0e1d2e"/>
      <stop offset="100%" stop-color="#08121d"/>
    </linearGradient>

    <linearGradient id="screen-sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#142c44"/>
      <stop offset="70%" stop-color="#0d1c2c"/>
      <stop offset="100%" stop-color="#07111c"/>
    </linearGradient>

    <linearGradient id="sweep-grad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>

    <!-- Subtle Grid Pattern -->
    <pattern id="hero-grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#57d6ff" stroke-opacity="0.04" stroke-width="1"/>
    </pattern>

    <!-- Clip Paths -->
    <clipPath id="card-screen-clip">
      <rect x="625" y="160" width="395" height="152" rx="10"/>
    </clipPath>

    <!-- Glow Filter -->
    <filter id="neon-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <style>
    text {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    /* Ambient float animations */
    @keyframes floatSlow {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-7px); }
    }
    @keyframes floatCard {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-5px); }
    }
    @keyframes pulseGlow {
      0%, 100% { opacity: 0.7; transform: scale(1); }
      50% { opacity: 1; transform: scale(1.08); }
    }
    @keyframes sweepPass {
      0% { transform: translateX(-600px); }
      100% { transform: translateX(1200px); }
    }

    /* Progress bar playback cycle */
    @keyframes playCycle {
      0% { width: 140px; }
      75% { width: 280px; }
      92% { width: 310px; }
      100% { width: 140px; }
    }
    @keyframes playheadMove {
      0% { transform: translateX(0px); }
      75% { transform: translateX(140px); }
      92% { transform: translateX(170px); }
      100% { transform: translateX(0px); }
    }

    /* Audio Equalizer bars */
    @keyframes eqBar1 { 0%, 100% { height: 6px; y: 18px; } 50% { height: 16px; y: 8px; } }
    @keyframes eqBar2 { 0%, 100% { height: 14px; y: 10px; } 50% { height: 7px; y: 17px; } }
    @keyframes eqBar3 { 0%, 100% { height: 9px; y: 15px; } 50% { height: 18px; y: 6px; } }
    @keyframes eqBar4 { 0%, 100% { height: 15px; y: 9px; } 50% { height: 8px; y: 16px; } }

    /* Ping Ripple for Cloud sync status */
    @keyframes beaconRipple {
      0% { r: 3.5; opacity: 1; }
      100% { r: 11; opacity: 0; }
    }
    @keyframes starTwinkle {
      0%, 100% { opacity: 0.3; transform: scale(0.8); }
      50% { opacity: 1; transform: scale(1.2); }
    }

    .card-floater { animation: floatCard 6.5s ease-in-out infinite; }
    .logo-glow { animation: pulseGlow 4s ease-in-out infinite; }
    .light-sweep { animation: sweepPass 10s linear infinite; }
    .bar-anim { animation: playCycle 8s ease-in-out infinite; }
    .head-anim { animation: playheadMove 8s ease-in-out infinite; }
    
    .eq-1 { animation: eqBar1 1.2s ease-in-out infinite; }
    .eq-2 { animation: eqBar2 0.9s ease-in-out infinite; }
    .eq-3 { animation: eqBar3 1.4s ease-in-out infinite; }
    .eq-4 { animation: eqBar4 1.1s ease-in-out infinite; }

    .beacon-core { fill: #63e0c7; }
    .beacon-wave {
      stroke: #63e0c7;
      stroke-width: 1.5;
      fill: none;
      animation: beaconRipple 2.2s cubic-bezier(0, 0.2, 0.8, 1) infinite;
      transform-origin: 946px 145px;
    }
    .star-1 { animation: starTwinkle 3s ease-in-out infinite; transform-origin: 720px 195px; }
    .star-2 { animation: starTwinkle 4s ease-in-out infinite 1.5s; transform-origin: 860px 180px; }

    @media (prefers-reduced-motion: reduce) {
      .card-floater, .logo-glow, .light-sweep, .bar-anim, .head-anim,
      .eq-1, .eq-2, .eq-3, .eq-4, .beacon-wave, .star-1, .star-2 {
        animation: none !important;
      }
    }
  </style>

  <!-- Container Box -->
  <rect x="1" y="1" width="1098" height="478" rx="24" fill="url(#bg-grad)" stroke="url(#border-shimmer)" stroke-width="2"/>
  <rect x="1" y="1" width="1098" height="478" rx="24" fill="url(#hero-grid)"/>
  <rect x="1" y="1" width="1098" height="478" rx="24" fill="url(#glow-cyan)"/>
  <rect x="1" y="1" width="1098" height="478" rx="24" fill="url(#glow-blue)"/>

  <!-- Shimmer sweep -->
  <g clip-path="url(#hero-clip)">
    <rect class="light-sweep" x="-500" y="0" width="450" height="480" fill="url(#sweep-grad)"/>
  </g>

  <!-- ================= LEFT COLUMN: HERO CONTENT ================= -->
  
  <!-- Brand Logo & Version Pill -->
  <g transform="translate(56, 52)">
    <!-- Stylized Cut-Angle T Brand Icon -->
    <g class="logo-glow">
      <rect x="0" y="0" width="48" height="48" rx="14" fill="#0d2338" stroke="#57d6ff" stroke-width="1.6"/>
      <path d="M14 15 H34 L30 22 H26 V33 H22 V22 H14 Z" fill="url(#brand-ink)"/>
    </g>
    <text x="62" y="32" fill="#ffffff" font-size="28" font-weight="700" letter-spacing="-0.5">An1me Tracker</text>
    
    <!-- Version Tag -->
    <rect x="250" y="13" width="76" height="24" rx="12" fill="#13273c" stroke="#2b4e70" stroke-width="1"/>
    <circle cx="262" cy="25" r="3.5" fill="#63e0c7"/>
    <text x="272" y="29.5" fill="#a4cbef" font-size="12" font-weight="700" letter-spacing="0.4">v8.2.0</text>
  </g>

  <!-- Catchy, Non-AI Centered Headline -->
  <g transform="translate(56, 172)">
    <text x="0" y="0" fill="url(#title-grad)" font-size="52" font-weight="800" letter-spacing="-1.8">
      Never lose your place.
    </text>
    <text x="0" y="58" fill="#57d6ff" font-size="50" font-weight="800" letter-spacing="-1.8">
      Watch. Resume. Sync.
    </text>

    <!-- Compact Punchy Subtitle -->
    <text x="2" y="112" fill="#9db6cf" font-size="19" font-weight="400">
      Autotrack episodes, 1-click resume, speed boost &amp; cross-device sync.
    </text>
  </g>

  <!-- Supported Platforms Badges -->
  <g transform="translate(56, 372)">
    <!-- Chrome / Edge Pill -->
    <g>
      <rect x="0" y="0" width="186" height="42" rx="21" fill="#0e2135" stroke="#25425f" stroke-width="1.3"/>
      <!-- Monitor Icon -->
      <g fill="none" stroke="#57d6ff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" transform="translate(18, 11)">
        <rect x="0" y="0" width="20" height="14" rx="2"/>
        <line x1="10" y1="14" x2="10" y2="18"/>
        <line x1="5" y1="18" x2="15" y2="18"/>
      </g>
      <text x="48" y="26" fill="#eaf3ff" font-size="14.5" font-weight="600">Chrome &amp; Edge</text>
    </g>

    <!-- Safari iPhone Pill -->
    <g transform="translate(202, 0)">
      <rect x="0" y="0" width="220" height="42" rx="21" fill="#0e2135" stroke="#25425f" stroke-width="1.3"/>
      <!-- Phone Icon -->
      <g fill="none" stroke="#63e0c7" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" transform="translate(18, 10)">
        <rect x="0" y="0" width="13" height="21" rx="3"/>
        <line x1="5" y1="17" x2="8" y2="17"/>
      </g>
      <text x="43" y="26" fill="#eaf3ff" font-size="14.5" font-weight="600">Safari on iPhone</text>
      <text x="162" y="26" fill="#6ba7d6" font-size="12" font-weight="500">(SideStore)</text>
    </g>
  </g>

  <!-- ================= RIGHT COLUMN: INTERACTIVE PLAYER CARD ================= -->
  
  <g class="card-floater">
    <!-- Card Frame -->
    <rect x="605" y="68" width="436" height="344" rx="20" fill="url(#card-bg)" stroke="#233e59" stroke-width="1.8"/>

    <!-- Window Header -->
    <g transform="translate(625, 88)">
      <circle cx="6" cy="6" r="4.5" fill="#ff5f57"/>
      <circle cx="20" cy="6" r="4.5" fill="#febc2e"/>
      <circle cx="34" cy="6" r="4.5" fill="#28c840"/>

      <!-- Window Title -->
      <text x="56" y="10" fill="#9db6cf" font-size="13.5" font-weight="600" letter-spacing="0.2">Now Playing</text>

      <!-- Sync Status with Ping Wave -->
      <g transform="translate(290, 0)">
        <circle cx="20" cy="6" r="7" class="beacon-wave"/>
        <circle cx="20" cy="6" r="3.5" class="beacon-core"/>
        <text x="32" y="10" fill="#63e0c7" font-size="12" font-weight="600">Cloud Synced</text>
      </g>
    </g>

    <!-- Mini Anime Player Screen -->
    <g clip-path="url(#card-screen-clip)">
      <rect x="625" y="118" width="395" height="152" fill="url(#screen-sky)"/>
      
      <!-- Stars & Moon in background -->
      <circle cx="945" cy="155" r="22" fill="#57d6ff" fill-opacity="0.85" filter="url(#neon-glow)"/>
      <circle cx="945" cy="155" r="22" fill="#d9f6ff"/>
      <circle cx="720" cy="150" r="1.8" fill="#ffffff" class="star-1"/>
      <circle cx="860" cy="138" r="1.5" fill="#ffffff" class="star-2"/>
      <circle cx="660" cy="170" r="1.4" fill="#ffffff" opacity="0.6"/>

      <!-- Mountain Silhouettes -->
      <path d="M 625 240 L 685 195 L 755 242 L 815 210 L 885 246 L 965 198 L 1020 240 L 1020 270 L 625 270 Z" fill="#13273e"/>
      <path d="M 625 250 L 710 215 L 775 254 L 845 224 L 920 258 L 1020 220 L 1020 270 L 625 270 Z" fill="#0a1727"/>

      <!-- Anime Torii Gate & Scenery Silhouette -->
      <g transform="translate(735, 196)" fill="#06101c">
        <rect x="0" y="3" width="46" height="5" rx="1.5"/>
        <path d="M -4 3 Q 23 -3 50 3 L 48 6 Q 23 2 -2 6 Z"/>
        <rect x="7" y="5" width="5" height="34"/>
        <rect x="34" y="5" width="5" height="34"/>
        <rect x="5" y="14" width="36" height="3"/>
      </g>

      <!-- Speed Badge floating on screen -->
      <g transform="translate(642, 134)">
        <rect x="0" y="0" width="70" height="24" rx="6" fill="#000000" fill-opacity="0.65" stroke="#57d6ff" stroke-width="1"/>
        <text x="10" y="16" fill="#57d6ff" font-size="12" font-weight="700">⚡ 2.0×</text>
      </g>

      <!-- Equalizer Visualizer on Screen -->
      <g transform="translate(960, 222)" fill="#57d6ff">
        <rect x="0" y="12" width="3.5" height="12" rx="1.5" class="eq-1"/>
        <rect x="6" y="6" width="3.5" height="18" rx="1.5" class="eq-2"/>
        <rect x="12" y="10" width="3.5" height="14" rx="1.5" class="eq-3"/>
        <rect x="18" y="8" width="3.5" height="16" rx="1.5" class="eq-4"/>
      </g>
    </g>

    <!-- Episode Meta -->
    <g transform="translate(625, 292)">
      <text x="0" y="0" fill="#ffffff" font-size="17" font-weight="700">Solo Leveling</text>
      <text x="0" y="20" fill="#88a5c2" font-size="13.5" font-weight="500">Season 2 · Episode 08</text>
      
      <!-- Resume Tag -->
      <rect x="315" y="-14" width="80" height="24" rx="12" fill="#132c42" stroke="#57d6ff" stroke-width="1"/>
      <text x="355" y="2" text-anchor="middle" fill="#57d6ff" font-size="11.5" font-weight="700">RESUMED</text>
    </g>

    <!-- Progress Bar Section -->
    <g transform="translate(625, 335)">
      <!-- Track Background -->
      <rect x="0" y="0" width="395" height="7" rx="3.5" fill="#16293d"/>
      
      <!-- Animated Progress Fill -->
      <rect class="bar-anim" x="0" y="0" width="190" height="7" rx="3.5" fill="url(#brand-ink)"/>

      <!-- Animated Playhead Glow & Dot -->
      <g class="head-anim" transform="translate(190, 3.5)">
        <circle cx="0" cy="0" r="9" fill="#57d6ff" fill-opacity="0.3" filter="url(#neon-glow)"/>
        <circle cx="0" cy="0" r="5" fill="#ffffff"/>
      </g>

      <!-- Time Stamps -->
      <text x="0" y="28" fill="#57d6ff" font-size="13" font-weight="600">14:20</text>
      <text x="395" y="28" text-anchor="end" fill="#6d8ba8" font-size="13" font-weight="500">23:45</text>
    </g>
  </g>
</svg>
