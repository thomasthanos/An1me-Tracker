<svg xmlns="http://www.w3.org/2000/svg" width="880" height="248" viewBox="0 0 880 248" role="img" aria-labelledby="title desc">
<title id="title">An1me Tracker features</title><desc id="desc">Exact-second resume, episode tracking at 85%, anime library, speed controls, optional cloud sync and filler / AniSkip support.</desc>
<defs>
 <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#14253b"/><stop offset="1" stop-color="#0b1220"/></linearGradient>
 <linearGradient id="edge"><stop stop-color="#65e8d4"/><stop offset=".5" stop-color="#65cfff"/><stop offset="1" stop-color="#a79bff"/></linearGradient>
 <linearGradient id="button" x2="1" y2="1"><stop stop-color="#8af5dd"/><stop offset="1" stop-color="#67cfff"/></linearGradient>
 <radialGradient id="glow"><stop stop-color="#3e9aff" stop-opacity=".25"/><stop offset="1" stop-color="#3e9aff" stop-opacity="0"/></radialGradient>
 <clipPath id="clip"><rect x="1" y="1" width="878" height="246" rx="18"/></clipPath>
</defs>
<style>
 text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}.ink{fill:#f0f6ff}.muted{fill:#aabdd3}.accent{fill:#84e4ff}
 @keyframes pulse{0%,100%{opacity:.4}50%{opacity:1}}
 @keyframes orbit{to{stroke-dashoffset:-120}}
 @keyframes progress{0%,15%{transform:scaleX(.62)}70%,100%{transform:scaleX(1)}}
 @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
 .pulse{animation:pulse 4s ease-in-out infinite}.orbit{animation:orbit 12s linear infinite}.progress{animation:progress 9s ease-in-out infinite;transform-box:fill-box;transform-origin:left center}.float{animation:float 7s ease-in-out infinite}
 @media(prefers-reduced-motion:reduce){.pulse,.orbit,.progress,.float{animation:none!important}}
</style>
<g transform="translate(0 0)"><rect x="1" y="1" width="278" height="118" rx="18" fill="url(#bg)" stroke="#2c425e"/>
 <path d="M15 1H265" stroke="#77ddff" stroke-opacity=".4"/>
 <g class="float"><g transform="translate(33.5 33.5) scale(0.65)" fill="none" stroke="#77ddff" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="m-4-7 11 7-11 7z"/><path d="M-15 0a15 15 0 1 1 4 10M-15 9v-9h9"/></g></g>
 <circle cx="266" cy="16" r="2" fill="#77ddff" class="pulse"/>
 <text x="17" y="72" class="ink" font-size="18" font-weight="650" letter-spacing="-.25">Exact-second resume</text>
 <text x="17" y="93" class="muted" font-size="12">Pick up where you left off.</text>
 <text x="17" y="110" class="muted" font-size="12">Saved timestamps. One click.</text></g>
<g transform="translate(300 0)"><rect x="1" y="1" width="278" height="118" rx="18" fill="url(#bg)" stroke="#2c425e"/>
 <path d="M15 1H265" stroke="#7ce9ce" stroke-opacity=".4"/>
 <g class="float"><g transform="translate(33.5 33.5) scale(0.65)" fill="none" stroke="#7ce9ce" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle r="14"/><path d="m-7 0 5 5 10-10"/></g></g>
 <circle cx="266" cy="16" r="2" fill="#7ce9ce" class="pulse"/>
 <text x="17" y="72" class="ink" font-size="18" font-weight="650" letter-spacing="-.25">Hands-free tracking</text>
 <text x="17" y="93" class="muted" font-size="12">Episodes marked at 85% watched.</text>
 <text x="17" y="110" class="muted" font-size="12">Your progress stays organised.</text></g>
<g transform="translate(600 0)"><rect x="1" y="1" width="278" height="118" rx="18" fill="url(#bg)" stroke="#2c425e"/>
 <path d="M15 1H265" stroke="#aca4ff" stroke-opacity=".4"/>
 <g class="float"><g transform="translate(33.5 33.5) scale(0.65)" fill="none" stroke="#aca4ff" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="-15" y="-13" width="8" height="26" rx="2"/><rect x="-3" y="-13" width="8" height="26" rx="2"/><path d="m9-12 7-2 7 25-7 2z"/></g></g>
 <circle cx="266" cy="16" r="2" fill="#aca4ff" class="pulse"/>
 <text x="17" y="72" class="ink" font-size="18" font-weight="650" letter-spacing="-.25">A library that’s yours</text>
 <text x="17" y="93" class="muted" font-size="12">Covers, search and categories.</text>
 <text x="17" y="110" class="muted" font-size="12">JSON backup and restore.</text></g>
<g transform="translate(0 128)"><rect x="1" y="1" width="278" height="118" rx="18" fill="url(#bg)" stroke="#2c425e"/>
 <path d="M15 1H265" stroke="#ffd085" stroke-opacity=".4"/>
 <g class="float"><g transform="translate(33.5 33.5) scale(0.65)" fill="none" stroke="#ffd085" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="m3-16-16 19H0l-3 13L13-3H0z"/></g></g>
 <circle cx="266" cy="16" r="2" fill="#ffd085" class="pulse"/>
 <text x="17" y="72" class="ink" font-size="18" font-weight="650" letter-spacing="-.25">Set your own pace</text>
 <text x="17" y="93" class="muted" font-size="12">F7 / F8 on desktop. Touch on iOS.</text>
 <text x="17" y="110" class="muted" font-size="12">Boost, skim and keep watching.</text></g>
<g transform="translate(300 128)"><rect x="1" y="1" width="278" height="118" rx="18" fill="url(#bg)" stroke="#2c425e"/>
 <path d="M15 1H265" stroke="#7ce9ce" stroke-opacity=".4"/>
 <g class="float"><g transform="translate(33.5 33.5) scale(0.65)" fill="none" stroke="#7ce9ce" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M-14-3a15 15 0 0 1 26-7M13-17v8H5M14 3a15 15 0 0 1-26 7M-13 17V9h8"/></g></g>
 <circle cx="266" cy="16" r="2" fill="#7ce9ce" class="pulse"/>
 <text x="17" y="72" class="ink" font-size="18" font-weight="650" letter-spacing="-.25">Across your devices</text>
 <text x="17" y="93" class="muted" font-size="12">Optional Firebase cloud sync.</text>
 <text x="17" y="110" class="muted" font-size="12">Your library and resume points.</text></g>
<g transform="translate(600 128)"><rect x="1" y="1" width="278" height="118" rx="18" fill="url(#bg)" stroke="#2c425e"/>
 <path d="M15 1H265" stroke="#aca4ff" stroke-opacity=".4"/>
 <g class="float"><g transform="translate(33.5 33.5) scale(0.65)" fill="none" stroke="#aca4ff" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="m-15-11 5-5H13v24L8 14h-23zM-8-7H6M-8 0H6M-8 7H1"/></g></g>
 <circle cx="266" cy="16" r="2" fill="#aca4ff" class="pulse"/>
 <text x="17" y="72" class="ink" font-size="18" font-weight="650" letter-spacing="-.25">Know what to skip</text>
 <text x="17" y="93" class="muted" font-size="12">Filler tags and AniSkip outro skip.</text>
 <text x="17" y="110" class="muted" font-size="12">Spend more time on the story.</text></g>
</svg>
