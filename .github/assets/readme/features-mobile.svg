 <circle cx="162" cy="16" r="2" fill="#7ce9ce" class="pulse"/>
 <text x="12" y="46" class="ink" font-size="15" font-weight="650" letter-spacing="-.25">Auto tracking</text>
 <text x="12" y="64" class="muted" font-size="11.5">Episodes at 85%</text>
 </g>
