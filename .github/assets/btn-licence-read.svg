<svg xmlns="http://www.w3.org/2000/svg" width="154" height="34" viewBox="0 0 154 34" role="img" aria-label="View License">
  <defs>
    <linearGradient id="btn-l-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#122438"/>
      <stop offset="100%" stop-color="#091522"/>
    </linearGradient>
    <linearGradient id="btn-l-border" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3d6c99" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#1b364f" stop-opacity="0.4"/>
    </linearGradient>
  </defs>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    @keyframes scaleGlow { 0%, 100% { opacity: 0.8; } 50% { opacity: 1; } }
    .btn-icon { animation: scaleGlow 3s ease-in-out infinite; }
    @media (prefers-reduced-motion: reduce) { .btn-icon { animation: none; } }
  </style>

  <rect x="0.8" y="0.8" width="152.4" height="32.4" rx="16.2" fill="url(#btn-l-bg)" stroke="url(#btn-l-border)" stroke-width="1.2"/>
  
  <!-- Legal / Balance Scales Icon -->
  <g class="btn-icon" transform="translate(15, 9)" fill="none" stroke="#57d6ff" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
    <line x1="8" y1="2" x2="8" y2="15"/>
    <line x1="2" y1="5" x2="14" y2="5"/>
    <polygon points="2,5 0,11 4,11" fill="#57d6ff"/>
    <polygon points="14,5 12,11 16,11" fill="#57d6ff"/>
  </g>
  
  <text x="38" y="21.5" fill="#edf3ff" font-size="12.5" font-weight="700" letter-spacing="0.2">View License</text>
</svg>
