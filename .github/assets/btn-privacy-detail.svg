<svg xmlns="http://www.w3.org/2000/svg" width="168" height="34" viewBox="0 0 168 34" role="img" aria-label="Privacy Policy">
  <defs>
    <linearGradient id="btn-p-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#122438"/>
      <stop offset="100%" stop-color="#091522"/>
    </linearGradient>
    <linearGradient id="btn-p-border" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3d6c99" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#1b364f" stop-opacity="0.4"/>
    </linearGradient>
  </defs>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    @keyframes shieldGlow { 0%, 100% { opacity: 0.8; } 50% { opacity: 1; } }
    .btn-icon { animation: shieldGlow 3s ease-in-out infinite; }
    @media (prefers-reduced-motion: reduce) { .btn-icon { animation: none; } }
  </style>

  <rect x="0.8" y="0.8" width="166.4" height="32.4" rx="16.2" fill="url(#btn-p-bg)" stroke="url(#btn-p-border)" stroke-width="1.2"/>
  
  <!-- Shield Icon -->
  <g class="btn-icon" transform="translate(15, 9)" fill="none" stroke="#63e0c7" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
    <path d="M 8 1 L 14 3.5 V 8.5 C 14 12.5 11 14.5 8 15.5 C 5 14.5 2 12.5 2 8.5 V 3.5 Z"/>
    <path d="M 5.5 8 L 7.5 10 L 10.5 6"/>
  </g>
  
  <text x="38" y="21.5" fill="#edf3ff" font-size="12.5" font-weight="700" letter-spacing="0.2">Privacy Policy</text>
</svg>
