<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="220" viewBox="0 0 1100 220" overflow="hidden" role="img" aria-labelledby="priv-title priv-desc">
  <title id="priv-title">Privacy and Permissions</title>
  <desc id="priv-desc">Zero telemetry, local-first storage, and optional isolated cloud sync.</desc>
  <defs>
    <linearGradient id="priv-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d1b2a"/>
      <stop offset="60%" stop-color="#08121d"/>
      <stop offset="100%" stop-color="#0a1624"/>
    </linearGradient>

    <linearGradient id="priv-border" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#63e0c7" stop-opacity="0.5"/>
      <stop offset="50%" stop-color="#23425f" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#57d6ff" stop-opacity="0.5"/>
    </linearGradient>

    <radialGradient id="priv-glow" cx="12%" cy="50%" r="40%">
      <stop offset="0%" stop-color="#63e0c7" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#63e0c7" stop-opacity="0"/>
    </radialGradient>

    <clipPath id="card-clip">
      <rect x="1" y="1" width="1098" height="218" rx="20"/>
    </clipPath>
  </defs>

  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    @keyframes haloGlow {
      0%, 100% { stroke-opacity: 0.3; }
      50% { stroke-opacity: 0.85; }
    }
    @keyframes lockBreathe {
      0%, 100% { opacity: 0.85; }
      50% { opacity: 1; }
    }
    .halo-anim { animation: haloGlow 3s ease-in-out infinite; }
    .shield-icon { animation: lockBreathe 3s ease-in-out infinite; }
    @media (prefers-reduced-motion: reduce) {
      .halo-anim, .shield-icon { animation: none !important; }
    }
  </style>

  <!-- Container Box with Safe Clip -->
  <g clip-path="url(#card-clip)">
    <rect x="1" y="1" width="1098" height="218" rx="20" fill="url(#priv-bg)"/>
    <rect x="1" y="1" width="1098" height="218" rx="20" fill="url(#priv-glow)"/>

    <!-- Left: Shield Icon (Comfortably inside the card margins) -->
    <g transform="translate(60, 62)">
      <!-- Ambient Circle with glowing border -->
      <circle cx="48" cy="48" r="38" fill="#0d2838" stroke="#1f4b5f" stroke-width="1.2"/>
      <circle cx="48" cy="48" r="38" fill="none" stroke="#63e0c7" stroke-width="1.5" class="halo-anim"/>

      <!-- Shield Outline -->
      <g class="shield-icon">
        <path d="M 48 27 L 64 34 V 48 C 64 59 57 67 48 71 C 39 67 32 59 32 48 V 34 Z" fill="#0b1e2c" stroke="#63e0c7" stroke-width="2.2" stroke-linejoin="round"/>
        
        <!-- Padlock inside Shield -->
        <rect x="43" y="47" width="10" height="9" rx="1.5" fill="#63e0c7"/>
        <path d="M 45.5 47 V 43.5 A 2.5 2.5 0 0 1 50.5 43.5 V 47" fill="none" stroke="#63e0c7" stroke-width="1.6"/>
      </g>
    </g>

    <!-- Center Content: Title and Statement -->
    <g transform="translate(180, 44)">
      <text x="0" y="0" fill="#ffffff" font-size="21" font-weight="700">Zero Telemetry. Client-Side Privacy.</text>
      <text x="0" y="23" fill="#57d6ff" font-size="14" font-weight="600">No trackers · No analytics SDKs · No ads · 100% private</text>
    </g>

    <!-- 3 Clean Rows with Checkmarks -->
    <g transform="translate(180, 102)">
      <!-- Row 1 -->
      <g transform="translate(0, 0)">
        <circle cx="8" cy="6" r="7.5" fill="#102e3b"/>
        <path d="M 5 6 L 7 8 L 11 4" fill="none" stroke="#63e0c7" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
        <text x="24" y="10" fill="#eaf3ff" font-size="14" font-weight="600">Offline By Default</text>
        <text x="165" y="10" fill="#88a5c2" font-size="13.5">— Your watch history and resume points stay strictly in your local browser storage.</text>
      </g>

      <!-- Row 2 -->
      <g transform="translate(0, 34)">
        <circle cx="8" cy="6" r="7.5" fill="#102e3b"/>
        <path d="M 5 6 L 7 8 L 11 4" fill="none" stroke="#63e0c7" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
        <text x="24" y="10" fill="#eaf3ff" font-size="14" font-weight="600">Scoped Cloud Sync</text>
        <text x="178" y="10" fill="#88a5c2" font-size="13.5">— Optional Firebase sync is isolated to your personal account (`users/{uid}`).</text>
      </g>

      <!-- Row 3 -->
      <g transform="translate(0, 68)">
        <circle cx="8" cy="6" r="7.5" fill="#102e3b"/>
        <path d="M 5 6 L 7 8 L 11 4" fill="none" stroke="#63e0c7" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
        <text x="24" y="10" fill="#eaf3ff" font-size="14" font-weight="600">Zero Third Parties</text>
        <text x="170" y="10" fill="#88a5c2" font-size="13.5">— No data is ever shared with, sold to, or tracked by any external analytics service.</text>
      </g>
    </g>
  </g>

  <!-- Border on Top -->
  <rect x="1" y="1" width="1098" height="218" rx="20" fill="none" stroke="url(#priv-border)" stroke-width="1.8"/>
</svg>
