<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="230" viewBox="0 0 1100 230" role="img" aria-labelledby="priv-title priv-desc">
  <title id="priv-title">Privacy and Permissions</title>
  <desc id="priv-desc">Zero telemetry, local-first storage, and optional isolated cloud sync.</desc>
  <defs>
    <linearGradient id="priv-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d1b2a"/>
      <stop offset="60%" stop-color="#08121d"/>
      <stop offset="100%" stop-color="#0a1624"/>
    </linearGradient>

    <linearGradient id="priv-border" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#63e0c7" stop-opacity="0.5"/>
      <stop offset="50%" stop-color="#23425f" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#57d6ff" stop-opacity="0.5"/>
    </linearGradient>

    <radialGradient id="priv-glow" cx="12%" cy="50%" r="40%">
      <stop offset="0%" stop-color="#63e0c7" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#63e0c7" stop-opacity="0"/>
    </radialGradient>

    <filter id="p-blur" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    @keyframes shieldPulse {
      0%, 100% { transform: scale(1); opacity: 0.85; }
      50% { transform: scale(1.08); opacity: 1; }
    }
    @keyframes scanStreak {
      0% { transform: translateX(-400px); }
      100% { transform: translateX(1100px); }
    }
    .shield-anim { animation: shieldPulse 3.5s ease-in-out infinite; transform-origin: 75px 115px; }
    @media (prefers-reduced-motion: reduce) { .shield-anim { animation: none; } }
  </style>

  <!-- Container Box -->
  <rect x="1" y="1" width="1098" height="228" rx="20" fill="url(#priv-bg)" stroke="url(#priv-border)" stroke-width="1.8"/>
  <rect x="1" y="1" width="1098" height="228" rx="20" fill="url(#priv-glow)"/>

  <!-- Left: Shield Icon with Neon Glow -->
  <g class="shield-anim" transform="translate(42, 65)">
    <!-- Ambient Halo -->
    <circle cx="48" cy="48" r="44" fill="#0d2838" stroke="#1f4b5f" stroke-width="1.2"/>
    <circle cx="48" cy="48" r="44" fill="none" stroke="#63e0c7" stroke-width="1.2" opacity="0.4" filter="url(#p-blur)"/>

    <!-- Shield Outline -->
    <path d="M 48 24 L 66 32 V 48 C 66 60 58 70 48 74 C 38 70 30 60 30 48 V 32 Z" fill="#0b1e2c" stroke="#63e0c7" stroke-width="2.4" stroke-linejoin="round"/>
    
    <!-- Padlock inside Shield -->
    <rect x="42" y="47" width="12" height="10" rx="2" fill="#63e0c7"/>
    <path d="M 45 47 V 43 A 3 3 0 0 1 51 43 V 47" fill="none" stroke="#63e0c7" stroke-width="1.8"/>
  </g>

  <!-- Center Content: Title and Statement -->
  <g transform="translate(170, 48)">
    <text x="0" y="0" fill="#ffffff" font-size="22" font-weight="700">Zero Telemetry. Client-Side Privacy.</text>
    <text x="0" y="24" fill="#57d6ff" font-size="14.5" font-weight="600">No trackers · No analytics SDKs · No ads · 100% private</text>
  </g>

  <!-- 3 Clean Rows with Checkmarks -->
  <g transform="translate(170, 108)">
    <!-- Row 1 -->
    <g transform="translate(0, 0)">
      <circle cx="8" cy="6" r="8" fill="#102e3b"/>
      <path d="M 5 6 L 7 8 L 11 4" fill="none" stroke="#63e0c7" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="24" y="10" fill="#eaf3ff" font-size="14" font-weight="600">Offline By Default</text>
      <text x="165" y="10" fill="#88a5c2" font-size="13.5">— Your watch history and resume points stay strictly in your local browser storage.</text>
    </g>

    <!-- Row 2 -->
    <g transform="translate(0, 36)">
      <circle cx="8" cy="6" r="8" fill="#102e3b"/>
      <path d="M 5 6 L 7 8 L 11 4" fill="none" stroke="#63e0c7" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="24" y="10" fill="#eaf3ff" font-size="14" font-weight="600">Scoped Cloud Sync</text>
      <text x="178" y="10" fill="#88a5c2" font-size="13.5">— Optional Firebase sync is isolated to your personal account (`users/{uid}`).</text>
    </g>

    <!-- Row 3 -->
    <g transform="translate(0, 72)">
      <circle cx="8" cy="6" r="8" fill="#102e3b"/>
      <path d="M 5 6 L 7 8 L 11 4" fill="none" stroke="#63e0c7" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="24" y="10" fill="#eaf3ff" font-size="14" font-weight="600">Zero Third Parties</text>
      <text x="170" y="10" fill="#88a5c2" font-size="13.5">— No data is ever shared with, sold to, or tracked by any external analytics service.</text>
    </g>
  </g>
</svg>
