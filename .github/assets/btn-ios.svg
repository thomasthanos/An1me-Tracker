<svg xmlns="http://www.w3.org/2000/svg" width="134" height="34" viewBox="0 0 134 34" overflow="hidden" role="img" aria-label="iPhone Setup">
  <defs>
    <linearGradient id="btn-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#122438"/>
      <stop offset="100%" stop-color="#091522"/>
    </linearGradient>
    <linearGradient id="btn-border" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3d6c99" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#1b364f" stop-opacity="0.4"/>
    </linearGradient>
  </defs>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    @keyframes applePulse { 0%, 100% { opacity: 0.75; } 50% { opacity: 1; } }
    .btn-icon { animation: applePulse 2.8s ease-in-out infinite; }
    @media (prefers-reduced-motion: reduce) { .btn-icon { animation: none; } }
  </style>

  <rect x="0.8" y="0.8" width="132.4" height="32.4" rx="16.2" fill="url(#btn-bg)" stroke="url(#btn-border)" stroke-width="1.2"/>
  
  <!-- Apple / Mobile Icon -->
  <g class="btn-icon" transform="translate(14, 9)" fill="none" stroke="#4ade80" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
    <rect x="1" y="0" width="11" height="17" rx="2.5"/>
    <circle cx="6.5" cy="13.5" r="0.8" fill="#4ade80"/>
  </g>
  
  <text x="35" y="21.5" fill="#edf3ff" font-size="12.5" font-weight="700" letter-spacing="0.2">iPhone Setup</text>
</svg>
