<svg xmlns="http://www.w3.org/2000/svg" width="112" height="34" viewBox="0 0 112 34" overflow="hidden" role="img" aria-label="Features">
  <defs>
    <linearGradient id="btn-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#122438"/>
      <stop offset="100%" stop-color="#091522"/>
    </linearGradient>
    <linearGradient id="btn-border" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3d6c99" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#1b364f" stop-opacity="0.4"/>
    </linearGradient>
  </defs>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    @keyframes twinkle { 0%, 100% { opacity: 0.75; } 50% { opacity: 1; } }
    .btn-icon { animation: twinkle 2.5s ease-in-out infinite; }
    @media (prefers-reduced-motion: reduce) { .btn-icon { animation: none; } }
  </style>

  <rect x="0.8" y="0.8" width="110.4" height="32.4" rx="16.2" fill="url(#btn-bg)" stroke="url(#btn-border)" stroke-width="1.2"/>
  
  <!-- Sparkles Icon -->
  <g class="btn-icon" transform="translate(13, 9)" fill="#57d6ff">
    <path d="M 6 0 L 7.5 4.5 L 12 6 L 7.5 7.5 L 6 12 L 4.5 7.5 L 0 6 L 4.5 4.5 Z"/>
    <circle cx="12" cy="12" r="1.5"/>
  </g>
  
  <text x="34" y="21.5" fill="#edf3ff" font-size="12.5" font-weight="700" letter-spacing="0.2">Features</text>
</svg>
