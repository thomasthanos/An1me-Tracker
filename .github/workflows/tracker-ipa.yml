# Builds An1me.to Tracker as an iOS app with its Safari extension, unsigned, for SideStore to sign with
# the user's own Apple ID, and attaches the .ipa to a GitHub release per extension version.
name: Tracker iOS app

on:
  push:
    branches: [main]
    paths:
      - "manifest.json"
      - "background.js"
      - "popup.html"
      - "src/**"
      - "dev/scripts/**"
      - "dev/test/**"
      - "ios/**"
      - ".github/workflows/tracker-ipa.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: tracker-ipa
  cancel-in-progress: true

env:
  APP_NAME: An1me Tracker
  # Match the iOS host ID generated for APP_NAME, including its case and hyphen.
  BUNDLE_ID: io.github.thomasthanos.An1me-Tracker
  IOS_DEPLOYMENT_TARGET: "18.0"

jobs:
  ipa:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Test
        run: node dev/scripts/run-tests.js

      - name: Package the extension for Safari
        id: meta
        run: |
          node dev/scripts/package.js --target safari
          echo "version=$(node -p 'require("./manifest.json").version')" >> "$GITHUB_OUTPUT"

      - name: Generate the Xcode project
        id: project
        run: |
          xcrun safari-web-extension-packager dist/an1me-tracker-safari \
            --project-location build \
            --app-name "$APP_NAME" \
            --bundle-identifier "$BUNDLE_ID" \
            --swift --ios-only --copy-resources --no-open --no-prompt --force
          project="$(find build -maxdepth 3 -name '*.xcodeproj' -print -quit)"
          test -n "$project"
          echo "path=$project" >> "$GITHUB_OUTPUT"
          xcodebuild -list -project "$project"

      - name: Configure native and adaptive iOS icons
        run: node dev/scripts/setup-ios-icons.js build

      - name: Configure iOS app UI
        run: node dev/scripts/setup-ios-ui.js build

      - name: Build (unsigned)
        run: |
          set -o pipefail
          mkdir -p build
          log="build/xcodebuild.log"
          status=0
          xcodebuild build \
            -project "${{ steps.project.outputs.path }}" \
            -scheme "$APP_NAME" \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -derivedDataPath build/DerivedData \
            IPHONEOS_DEPLOYMENT_TARGET="$IOS_DEPLOYMENT_TARGET" \
            MARKETING_VERSION="${{ steps.meta.outputs.version }}" \
            CURRENT_PROJECT_VERSION="$GITHUB_RUN_NUMBER" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            > "$log" 2>&1 || status=$?
          # A bare `| tail -n 40` used to reduce a failed build to "exit code 65": the tail fills up with
          # asset-catalog chatter and the diagnostic scrolls out of the window. Print the tail, then the
          # lines that actually explain the failure.
          tail -n 15 "$log"
          if [ "$status" -ne 0 ]; then
            # Printed plainly, and repeated in the job summary. An earlier version wrapped this in
            # `::group::`, which GitHub collapses in the log view — so the one line anybody needs was
            # hidden behind a disclosure triangle and a failed build looked like "exit code 65".
            errors="$(grep -nE -m 40 "error:|fatal error:|Undefined symbols|Multiple commands produce|ld: " "$log" || true)"
            if [ -z "$errors" ]; then
              errors="(no error: line found; see the xcodebuild-log artifact)"
            fi
            printf '%s\n' "$errors"
            {
              echo "### Build failed (exit $status)"
              echo ""
              echo '```'
              printf '%s\n' "$errors"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::error::xcodebuild failed with exit $status. The full log is attached to this run."
          fi
          exit "$status"

      - name: Upload the build log
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: xcodebuild-log
          path: build/xcodebuild.log
          if-no-files-found: ignore
          retention-days: 7

      # An .ipa is the .app inside a Payload folder, zipped. SideStore signs the app and its extension.
      - name: Package the .ipa
        id: ipa
        run: |
          app="$(find build/DerivedData/Build/Products/Release-iphoneos -maxdepth 1 -name '*.app' -print -quit)"
          appex="$(find "$app/PlugIns" -maxdepth 1 -name '*.appex' -print -quit)"
          test -n "$app" && test -n "$appex"
          # The extension sends the user to its Settings page through this link (an1metracker://safari-settings).
          scheme="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleURLTypes:0:CFBundleURLSchemes:0' "$app/Info.plist" 2>/dev/null || true)"
          if [ "$scheme" != "an1metracker" ]; then echo "::error::The app does not register an1metracker://"; exit 1; fi
          manifest="$(find "$appex" -name manifest.json -print -quit)"
          node -e '
            const m = require(process.argv[1]);
            for (const p of ["identity", "notifications", "sidePanel"]) if (m.permissions.includes(p)) throw new Error("Safari manifest still requests " + p);
            console.log("Extension", m.name, m.version, "permissions:", m.permissions.join(", "));
          ' "$PWD/$manifest"
          ipa="An1meTracker-${{ steps.meta.outputs.version }}.ipa"
          mkdir -p build/ipa/Payload
          cp -R "$app" build/ipa/Payload/
          (cd build/ipa && zip -qry "../$ipa" Payload)
          echo "file=build/$ipa" >> "$GITHUB_OUTPUT"
          echo "name=$ipa" >> "$GITHUB_OUTPUT"
          unzip -l "build/$ipa" | grep -E '\.appex/(Info\.plist|.*manifest\.json)$'

      - name: Generate the SideStore source
        run: |
          app="$(find build/ipa/Payload -maxdepth 1 -name '*.app' -print -quit)"
          plutil -convert json -o build/app-info.json "$app/Info.plist"
          node dev/scripts/sidestore-source.js build/app-info.json "${{ steps.ipa.outputs.file }}" "$GITHUB_REPOSITORY" > build/source.json

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.ipa.outputs.name }}
          path: ${{ steps.ipa.outputs.file }}
          if-no-files-found: error

      - uses: actions/upload-artifact@v7
        with:
          name: SideStore-Source
          path: build/source.json
          if-no-files-found: error

      - name: Attach to the release for this version
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          tag="tracker-v$VERSION"
          if gh release view "$tag" > /dev/null 2>&1; then
            gh release upload "$tag" "${{ steps.ipa.outputs.file }}" --clobber
          else
            gh release create "$tag" "${{ steps.ipa.outputs.file }}" \
              --target "$GITHUB_SHA" \
              --title "An1me.to Tracker $VERSION — iPhone (SideStore)" \
              --notes "Unsigned iOS app with the Safari extension. Install it with SideStore, which signs it with your Apple ID — see [IOS.md](https://github.com/${{ github.repository }}/blob/main/IOS.md). Changes: [CHANGELOG](https://github.com/${{ github.repository }}/blob/main/CHANGELOG.md)."
          fi

      # Publish the feed only after its IPA is available. This URL stays the same across versions.
      - name: Publish the SideStore source
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="tracker-source"
          if gh release view "$tag" > /dev/null 2>&1; then
            gh release upload "$tag" build/source.json --clobber
          else
            gh release create "$tag" build/source.json \
              --target "$GITHUB_SHA" --prerelease --latest=false \
              --title "An1me.to Tracker — SideStore Source" \
              --notes "Add this URL in SideStore Sources: https://github.com/${{ github.repository }}/releases/download/tracker-source/source.json . The build workflow updates it after publishing each IPA."
          fi
